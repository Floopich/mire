<!-- ═══ Panel: About / Attribution ═══ -->
<div class="settings-panel" id="panel-support">
    <div class="settings-card glass">
        <div class="card-header">
            <div class="card-title-group">
                <div class="card-icon purple">
                    <i data-lucide="heart-handshake"></i>
                </div>
                <div>
                    <div class="card-title">{{ t.support_title }}</div>
                    <div class="card-subtitle">{{ t.support_subtitle }}</div>
                </div>
            </div>
        </div>

        <p class="support-attribution">
            {{ t.get('support_attribution', 'Mire is a fork of DOCSight by itsDNNS, released under the MIT License and adapted for VOO subscribers in Wallonia.') }}
        </p>
        <p class="support-attribution">
            <a href="https://github.com/floopich/mire" target="_blank" rel="noopener noreferrer">
                <i data-lucide="external-link"></i>
                {{ t.get('support_project_link', 'Mire on GitHub') }}
            </a>
        </p>
    </div>
</div>
