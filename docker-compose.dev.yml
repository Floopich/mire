services:
  mire-v2-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mire-v2-dev
    restart: unless-stopped
    ports:
      - "8767:1340"
    volumes:
      - mire_v2_dev_data:/data
      - mire_v2_dev_backup:/backup
    cap_add:
      - NET_RAW
    environment:
      - TZ=Europe/Brussels

volumes:
  mire_v2_dev_data:
  mire_v2_dev_backup:
