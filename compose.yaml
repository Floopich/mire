# Compose des campagnes de mesure : un dossier de donnees par site, pilote par
# ./scripts/site.sh qui genere le .env. Pour une installation normale, suivre
# le Quick Start de INSTALL.md : ce fichier n'est pas prevu pour un premier
# demarrage juste apres un clone.
services:
  mire:
    image: ghcr.io/${GH_OWNER:?lancer ./scripts/site.sh start <site>, il renseigne .env}/mire:${MIRE_TAG:-latest}
    # build: .          # decommenter pour construire localement au lieu de tirer l'image
    container_name: mire
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./sites/${SITE:?definir SITE dans .env, ou lancer ./scripts/site.sh start <site>}/data:/data
    cap_add:
      - NET_RAW
    environment:
      - TZ=${TZ:-Europe/Brussels}
      - SITE=${SITE}
      - WEB_PORT=${WEB_PORT:-1340}
      - BOOKED_DOWNLOAD=${BOOKED_DOWNLOAD:-}
      - BOOKED_UPLOAD=${BOOKED_UPLOAD:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
