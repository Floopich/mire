# docker compose up -d, puis http://<machine>:1340
services:
  mire:
    image: ghcr.io/floopich/mire:latest
    container_name: mire
    restart: unless-stopped
    ports:
      - "1340:1340"
    volumes:
      - mire-data:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Facultatif, voir docs/configuration.md :
    # environment:
    #   TZ: Europe/Brussels

volumes:
  mire-data:
