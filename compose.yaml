# docker compose up -d, puis http://<machine>:1340
services:
  mire:
    image: ghcr.io/floopich/mire:latest
    container_name: mire
    restart: unless-stopped
    ports:
      - "1340:1340"
    volumes:
      - mire-data:/data
    # Facultatif, voir docs/configuration.md :
    # environment:
    #   TZ: Europe/Brussels

volumes:
  mire-data:
