name: Nouvel opérateur
description: Proposer les seuils d'un opérateur, pour que Mire juge sa ligne.
labels: ["opérateur"]
body:
  - type: markdown
    attributes:
      value: |
        Voir CONTRIBUTING.md, « Ajouter un opérateur ».
  - type: input
    id: operateur
    attributes:
      label: Opérateur et pays
      placeholder: Telenet, Belgique
    validations:
      required: true
  - type: input
    id: modem
    attributes:
      label: Modem fourni
      placeholder: Technicolor CGA4233, ou autre modèle
    validations:
      required: true
  - type: textarea
    id: seuils
    attributes:
      label: Seuils connus
      description: Puissance descendante et montante, SNR minimal, avec leur source si possible.
    validations:
      required: true
  - type: textarea
    id: releve
    attributes:
      label: Relevé d'une ligne saine
      description: Facultatif. Page des canaux du modem, sans mot de passe ni numéro de série.
      render: text
