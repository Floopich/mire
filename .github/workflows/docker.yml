name: Image Docker

on:
  push:
    branches: [main]
    # Seul un numéro de version publie : v1.2.3, ou v1.2.3-rc1. Un tag mal
    # formé (v.1.2.3, v1.2) ne déclenche rien.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:

permissions: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Sur un tag, l'image n'est publiee qu'une fois les tests passes ; sur
  # main et les pull requests, test.yml tourne deja a cote.
  tests:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/test.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  image:
    needs: tests
    # Tests sautes (hors tag) : l'image se construit quand meme ; tests en
    # echec : rien n'est publie.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Attestation de provenance : identite du depot (id-token) et
      # enregistrement sur GitHub (attestations).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Version affichee par l'interface : le tag pour une publication,
      # « main-<commit> » sinon, plutot qu'un simple nom de branche.
      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "valeur=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "valeur=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          # Nom de l'image en minuscules, pour l'attestation de provenance.
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mire" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/mire
          # latest, et son synonyme stable, designent la derniere version
          # publiee : ils ne bougent qu'avec un tag vX.Y.Z sans suffixe. testing
          # suit toutes les versions, celles de test comprises (v1.9.0-rc1),
          # puis la version finale. main suit la branche de developpement.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=testing,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=main,enable={{is_default_branch}}

      # Une pull request construit l'image sans la publier : elle verifie que
      # la compilation croisee passe sur les trois architectures.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.valeur }}
          # Liste des composants (SBOM) jointe a l'image, lue par les
          # scanners de failles.
          sbom: ${{ github.event_name != 'pull_request' }}
          # Une version publiee se construit sans cache, comme les binaires :
          # elle ne doit rien a une execution precedente.
          no-cache: ${{ startsWith(github.ref, 'refs/tags/') }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Provenance verifiable : gh attestation verify oci://<image> -R <depot>
      # prouve que l'image vient de ce depot et de ce workflow.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ steps.version.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
