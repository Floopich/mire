name: Image Docker

on:
  push:
    branches: [main]
    # Seul un numéro de version publie : v1.2.3, ou v1.2.3-rc1. Un tag mal
    # formé (v.1.2.3, v1.2) ne déclenche rien.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Version affichee par l'interface : le tag pour une publication,
      # « main-<commit> » sinon, plutot qu'un simple nom de branche.
      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "valeur=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "valeur=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/mire
          # latest designe la derniere version publiee, jamais un etat de
          # developpement : il ne bouge qu'avec un tag vX.Y.Z sans suffixe
          # (une pre-version v1.2.0-rc1 ne le deplace pas). main suit la
          # branche, pour qui veut tester avant publication.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short

      # Une pull request construit l'image sans la publier : elle verifie que
      # la compilation croisee passe sur les trois architectures.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.valeur }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
