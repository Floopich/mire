name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Chaque semaine, pour les failles publiees depuis le dernier changement.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Derniere version stable de Go, correctifs de securite compris : go.mod
      # ne fixe que la version minimale.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Formatage
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Fichiers non formates :"
            echo "$unformatted"
            exit 1
          fi

      - name: Analyse statique
        run: go vet ./...

      - name: Tests (pilote cgo)
        run: go test -race ./...

      # Les binaires distribues sont compiles en Go pur : si seule la variante
      # cgo etait testee, une regression du pilote ne se verrait qu'apres la
      # publication.
      - name: Tests (pilote Go pur)
        run: go test -tags purego ./...

      # L'image et les binaires existent aussi en armv7, ou un int tient sur
      # 32 bits : les compteurs du modem depassent 2^31. Les tests tournent
      # donc aussi sur une architecture 32 bits.
      - name: Tests en 32 bits (pilote Go pur)
        env:
          CGO_ENABLED: "0"
          GOARCH: "386"
        run: go test -tags purego ./...

      - name: Failles connues (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags purego ./...

      - name: Compilation croisee du binaire distribue
        env:
          CGO_ENABLED: "0"
        run: |
          # Memes cibles que la publication (release.yml), Windows compris :
          # une cible cassee se voit ici, pas le jour du tag.
          for cible in linux/arm64 linux/arm linux/amd64 windows/amd64; do
            GOOS="${cible%/*}" GOARCH="${cible#*/}" \
              go build -tags purego ./... || exit 1
          done

  # Le binaire Windows est publie : ses tests tournent sur Windows, avec le
  # pilote Go pur qu'il embarque.
  windows:
    runs-on: windows-latest
    steps:
      # Fichiers de test tels quels, sans conversion des fins de ligne.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: Tests (pilote Go pur)
        env:
          CGO_ENABLED: "0"
        run: go test -tags purego ./...
